<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>MÆDNESS — Next Event</title>
  <style>
    :root {
      color-scheme: dark;
      --black: #050505;
      --white: #f7f5f5;
      --red: #ff1725;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--black);
    }

    body {
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .stage {
      position: relative;
      display: grid;
      width: 100%;
      height: 100%;
      height: 100svh;
      min-height: 100%;
      place-items: center;
      overflow: hidden;
      background: var(--black);
      isolation: isolate;
    }

    .countdown {
      --reveal-x: 50%;
      --reveal-y: 50%;
      --reveal-size: 0px;
      position: absolute;
      z-index: 0;
      top: 50%;
      left: 50%;
      display: grid;
      width: min(96vw, 780px);
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(2px, 2.1vw, 18px);
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      opacity: 0;
      -webkit-mask-image: radial-gradient(
        circle var(--reveal-size) at var(--reveal-x) var(--reveal-y),
        #fff 0%, #fff 54%, transparent 100%
      );
      mask-image: radial-gradient(
        circle var(--reveal-size) at var(--reveal-x) var(--reveal-y),
        #fff 0%, #fff 54%, transparent 100%
      );
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      transition: opacity .18s ease;
    }

    .countdown.is-revealed {
      opacity: 1;
    }

    .unit {
      display: grid;
      justify-items: center;
      gap: clamp(4px, 1.5vw, 10px);
      min-width: 0;
    }

    .value {
      color: var(--red);
      font-family: "Arial Black", Arial, sans-serif;
      font-size: clamp(30px, 9.5vw, 76px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: .9;
      letter-spacing: -.055em;
      text-shadow: 0 0 24px rgba(255, 23, 37, .2);
    }

    .label {
      color: rgba(255, 255, 255, .78);
      font-family: "Courier New", monospace;
      font-size: clamp(8px, 2.2vw, 12px);
      font-weight: 700;
      letter-spacing: .14em;
      line-height: 1;
    }

    .logo-particles {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    @media (max-width: 360px) {
      .countdown {
        width: 98vw;
        gap: 0;
      }

      .label {
        letter-spacing: .08em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .value {
        text-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Countdown MÆDNESS">
    <div class="countdown" role="timer" aria-label="Tempo al prossimo evento">
      <div class="unit"><span class="value" data-days>00</span><span class="label">DAYS</span></div>
      <div class="unit"><span class="value" data-hours>00</span><span class="label">HOURS</span></div>
      <div class="unit"><span class="value" data-minutes>00</span><span class="label">MIN</span></div>
      <div class="unit"><span class="value" data-seconds>00</span><span class="label">SEC</span></div>
    </div>
    <canvas class="logo-particles" aria-hidden="true"></canvas>
  </main>

  <script>
    (() => {
      const EVENT_DATE = new Date("2026-12-18T23:30:00+01:00").getTime();
      const LOGO_URL = "./maedness-logo.png";
      const canvas = document.querySelector(".logo-particles");
      const ctx = canvas.getContext("2d", { alpha: true });
      const countdownNode = document.querySelector(".countdown");
      const daysNode = document.querySelector("[data-days]");
      const hoursNode = document.querySelector("[data-hours]");
      const minutesNode = document.querySelector("[data-minutes]");
      const secondsNode = document.querySelector("[data-seconds]");
      const logo = new Image();
      const pointer = { x: -1000, y: -1000, active: false, pressed: false };

      let particles = [];
      let backgroundParticles = [];
      let frameId = 0;
      let canvasWidth = 0;
      let canvasHeight = 0;
      let scale = 1;
      let particleStep = 4;
      let imageData = null;
      let bounds = null;
      let logoPlacement = null;

      function updateCountdown() {
        const remaining = Math.max(0, EVENT_DATE - Date.now());
        const totalSeconds = Math.floor(remaining / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        daysNode.textContent = String(days).padStart(2, "0");
        hoursNode.textContent = String(hours).padStart(2, "0");
        minutesNode.textContent = String(minutes).padStart(2, "0");
        secondsNode.textContent = String(seconds).padStart(2, "0");
      }

      function isLogoPixel(r, g, b) {
        const isRed = r > 55 && r > g * 1.35 && r > b * 1.35;
        const isWhite = r > 105 && g > 105 && b > 105;
        return isRed || isWhite;
      }

      function findLogoBounds(data, width, height) {
        let minX = width;
        let minY = height;
        let maxX = -1;
        let maxY = -1;

        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const index = (y * width + x) * 4;
            if (!isLogoPixel(data[index], data[index + 1], data[index + 2])) continue;
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
          }
        }

        if (maxX < minX || maxY < minY) return null;

        const margin = 5;
        return {
          x: Math.max(0, minX - margin),
          y: Math.max(0, minY - margin),
          right: Math.min(width - 1, maxX + margin),
          bottom: Math.min(height - 1, maxY + margin)
        };
      }

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvasWidth = window.innerWidth;
        canvasHeight = window.innerHeight;
        canvas.width = Math.round(canvasWidth * dpr);
        canvas.height = Math.round(canvasHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        createBackgroundParticles();

        if (imageData && bounds) createParticles();
      }

      function createParticles() {
        particles = [];

        const logoWidth = bounds.right - bounds.x + 1;
        const logoHeight = bounds.bottom - bounds.y + 1;
        const maxLogoWidth = Math.min(
          window.innerWidth * .92,
          window.innerHeight * .72,
          720
        );
        const drawWidth = maxLogoWidth;
        scale = drawWidth / logoWidth;
        const drawHeight = logoHeight * scale;
        const offsetX = (canvasWidth - drawWidth) / 2;
        const offsetY = (canvasHeight - drawHeight) / 2;
        logoPlacement = { x: offsetX, y: offsetY, width: drawWidth, height: drawHeight };
        particleStep = window.innerWidth < 500 ? 4.15 : 3.8;

        // Il passo minimo limita il numero di particelle sui display grandi.
        const sourceStep = Math.max(particleStep / scale, 3.2);
        const source = imageData.data;
        const sourceWidth = imageData.width;
        const digits = "0123456789";

        for (let y = bounds.y + sourceStep / 2; y <= bounds.bottom; y += sourceStep) {
          for (let x = bounds.x + sourceStep / 2; x <= bounds.right; x += sourceStep) {
            const sx = Math.floor(x);
            const sy = Math.floor(y);
            const index = (sy * sourceWidth + sx) * 4;
            const r = source[index];
            const g = source[index + 1];
            const b = source[index + 2];

            if (!isLogoPixel(r, g, b)) continue;

            const red = r > g * 1.35 && r > b * 1.35;
            const px = offsetX + (x - bounds.x) * scale;
            const py = offsetY + (y - bounds.y) * scale;
            const angle = Math.random() * Math.PI * 2;

            particles.push({
              x: px,
              y: py,
              originX: px,
              originY: py,
              vx: 0,
              vy: 0,
              phase: Math.random() * Math.PI * 2,
              drift: .35 + Math.random() * .75,
              angle,
              char: digits[Math.floor(Math.random() * digits.length)],
              color: red ? "#ff2635" : "#f7f5f5"
            });
          }
        }
      }

      function createBackgroundParticles() {
        const area = canvasWidth * canvasHeight;
        const count = Math.min(180, Math.max(72, Math.round(area / 6800)));
        const digits = "0123456789";

        backgroundParticles = Array.from({ length: count }, () => ({
          x: Math.random() * canvasWidth,
          y: Math.random() * canvasHeight,
          originX: 0,
          originY: 0,
          vx: 0,
          vy: 0,
          phase: Math.random() * Math.PI * 2,
          speed: .00025 + Math.random() * .00045,
          drift: 2 + Math.random() * 8,
          size: 5 + Math.random() * 4,
          alpha: .09 + Math.random() * .11,
          char: digits[Math.floor(Math.random() * digits.length)],
          color: Math.random() < .26 ? "#ff2635" : "#c7c4c4"
        }));

        for (const particle of backgroundParticles) {
          particle.originX = particle.x;
          particle.originY = particle.y;
        }
      }

      function pointIsOnLogo(x, y) {
        if (!imageData || !bounds || !logoPlacement) return false;

        const { x: left, y: top, width, height } = logoPlacement;
        if (x < left || x > left + width || y < top || y > top + height) return false;

        const sourceX = bounds.x + (x - left) / scale;
        const sourceY = bounds.y + (y - top) / scale;
        const tolerance = Math.max(2, 8 / scale);
        const source = imageData.data;
        const sourceWidth = imageData.width;

        for (let dy = -tolerance; dy <= tolerance; dy += 3) {
          for (let dx = -tolerance; dx <= tolerance; dx += 3) {
            const sx = Math.round(sourceX + dx);
            const sy = Math.round(sourceY + dy);
            if (
              sx < 0 || sy < 0 ||
              sx >= sourceWidth || sy >= imageData.height
            ) continue;

            const index = (sy * sourceWidth + sx) * 4;
            if (isLogoPixel(source[index], source[index + 1], source[index + 2])) {
              return true;
            }
          }
        }

        return false;
      }

      function setCountdownReveal(x, y, visible) {
        if (!visible) {
          countdownNode.classList.remove("is-revealed");
          countdownNode.style.setProperty("--reveal-size", "0px");
          return;
        }

        const rect = countdownNode.getBoundingClientRect();
        countdownNode.style.setProperty("--reveal-x", `${x - rect.left}px`);
        countdownNode.style.setProperty("--reveal-y", `${y - rect.top}px`);
        countdownNode.style.setProperty(
          "--reveal-size",
          `${Math.min(154, Math.max(108, window.innerWidth * .34))}px`
        );
        countdownNode.classList.add("is-revealed");
      }

      function render() {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const now = performance.now();
        const radius = Math.min(145, Math.max(92, window.innerWidth * .3));
        const radiusSquared = radius * radius;

        // Numeri appena visibili sul fondo, con una deriva lenta e indipendente.
        for (const particle of backgroundParticles) {
          const targetX = particle.originX +
            Math.sin(now * particle.speed + particle.phase) * particle.drift;
          const targetY = particle.originY +
            Math.cos(now * particle.speed * .83 + particle.phase) * particle.drift;

          particle.vx += (targetX - particle.x) * .018;
          particle.vy += (targetY - particle.y) * .018;

          if (pointer.active) {
            const dx = particle.x - pointer.x;
            const dy = particle.y - pointer.y;
            const distanceSquared = dx * dx + dy * dy;
            if (distanceSquared < radiusSquared) {
              const distance = Math.sqrt(distanceSquared) || 1;
              const push = (1 - distance / radius) * .9;
              particle.vx += dx / distance * push;
              particle.vy += dy / distance * push;
            }
          }

          particle.vx *= .92;
          particle.vy *= .92;
          particle.x += particle.vx;
          particle.y += particle.vy;

          ctx.globalAlpha = particle.alpha;
          ctx.fillStyle = particle.color;
          ctx.font = `700 ${particle.size}px "Courier New", monospace`;
          ctx.fillText(particle.char, particle.x, particle.y);
        }

        ctx.globalAlpha = 1;
        ctx.font = `700 ${particleStep * 1.08}px "Courier New", monospace`;

        // I numeri del logo respirano leggermente e restano sopra al countdown.
        for (const particle of particles) {
          const targetX = particle.originX +
            Math.sin(now * .0012 + particle.phase) * particle.drift;
          const targetY = particle.originY +
            Math.cos(now * .00105 + particle.phase) * particle.drift;
          particle.vx += (targetX - particle.x) * .028;
          particle.vy += (targetY - particle.y) * .028;

          if (pointer.active) {
            const dx = particle.x - pointer.x;
            const dy = particle.y - pointer.y;
            const distanceSquared = dx * dx + dy * dy;

            if (distanceSquared < radiusSquared) {
              const distance = Math.sqrt(distanceSquared) || 1;
              const push = (1 - distance / radius) * 2.8;
              const nx = distance === 1 && distanceSquared === 0
                ? Math.cos(particle.angle)
                : dx / distance;
              const ny = distance === 1 && distanceSquared === 0
                ? Math.sin(particle.angle)
                : dy / distance;
              particle.vx += nx * push;
              particle.vy += ny * push;
            }
          }

          particle.vx *= .88;
          particle.vy *= .88;
          particle.x += particle.vx;
          particle.y += particle.vy;

          ctx.fillStyle = particle.color;
          ctx.fillText(particle.char, particle.x, particle.y);
        }

        frameId = window.requestAnimationFrame(render);
      }

      function setPointer(event) {
        pointer.x = event.clientX;
        pointer.y = event.clientY;
        const overLogo = pointIsOnLogo(pointer.x, pointer.y);
        pointer.active = overLogo && (
          event.pointerType === "mouse" || pointer.pressed
        );
        setCountdownReveal(pointer.x, pointer.y, pointer.active);
      }

      canvas.addEventListener("pointerdown", (event) => {
        pointer.pressed = event.pointerType !== "mouse" &&
          pointIsOnLogo(event.clientX, event.clientY);
        setPointer(event);
        if (canvas.setPointerCapture) canvas.setPointerCapture(event.pointerId);
      });

      canvas.addEventListener("pointermove", setPointer, { passive: true });

      canvas.addEventListener("pointerup", (event) => {
        pointer.pressed = false;
        pointer.active = event.pointerType === "mouse" &&
          pointIsOnLogo(event.clientX, event.clientY);
        setCountdownReveal(event.clientX, event.clientY, pointer.active);
      });

      canvas.addEventListener("pointercancel", () => {
        pointer.pressed = false;
        pointer.active = false;
        setCountdownReveal(0, 0, false);
      });

      canvas.addEventListener("pointerleave", (event) => {
        if (event.pointerType === "mouse") {
          pointer.active = false;
          setCountdownReveal(0, 0, false);
        }
      });

      updateCountdown();
      window.setInterval(updateCountdown, 1000);

      logo.onload = () => {
        const sampleCanvas = document.createElement("canvas");
        sampleCanvas.width = 1000;
        sampleCanvas.height = Math.round(1000 * logo.naturalHeight / logo.naturalWidth);
        const sampleContext = sampleCanvas.getContext("2d", { willReadFrequently: true });
        sampleContext.drawImage(logo, 0, 0, sampleCanvas.width, sampleCanvas.height);
        imageData = sampleContext.getImageData(0, 0, sampleCanvas.width, sampleCanvas.height);
        bounds = findLogoBounds(imageData.data, sampleCanvas.width, sampleCanvas.height);

        resizeCanvas();
        if (!frameId) frameId = window.requestAnimationFrame(render);
      };

      logo.src = LOGO_URL;
      window.addEventListener("resize", resizeCanvas, { passive: true });
      resizeCanvas();
    })();
  </script>
</body>
</html>
